<!DOCTYPE html>
<html lang="en">

<head>
  <title>Earth 3D Model - Earth_1_12756.glb</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #info {
      color: #888888;
      position: absolute;
      top: 10px;
      width: 100%;
      z-index: 100;
      display: block;
    }
  </style>
</head>

<body>
  <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.177.0/build/three.module.js",
          "three/addons/controls/OrbitControls": "https://unpkg.com/three@0.177.0/examples/jsm/controls/OrbitControls.js",
          "three/addons/loaders/GLTFLoader": "https://unpkg.com/three@0.177.0/examples/jsm/loaders/GLTFLoader.js"
        }
      }
    </script>
  <div id="info">
    Earth 3D Model - https://science.nasa.gov/resource/earth-3d-model/
    <div id="automatically_generated">
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/6.0.1/satellite.min.js"></script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader';

    const renderer = new THREE.WebGLRenderer();
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1;
    document.body.appendChild(renderer.domElement);
    const scene = new THREE.Scene();

    const scale = 500 / 6378.137;

    // XYZ軸を表示
    const axesHelper = new THREE.AxesHelper(10000 * scale);
    scene.add(axesHelper);

    const now = new Date();
    // const now = new Date('2025-3-21 12:00:00+0:00');
    const jday = satellite.jday(now);
    const gmst = satellite.gstime(now);

    // カメラ
    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      1,
      100000 * scale
    );
    (() => {
      const eci = satellite.ecfToEci(satellite.geodeticToEcf({
        longitude: satellite.degreesToRadians(150.0),
        latitude: 0.0,
        height: 100000 * scale
      }), gmst)
      camera.position.set(eci.y * scale, eci.z * scale, eci.x * scale);
    })();
    const controls = new OrbitControls(camera, renderer.domElement);

    function initLight() {
      // 平行光源
      const directionalLight = new THREE.DirectionalLight(0xffffff, 10);
      const rsun = satellite.sunPos(jday).rsun;
      directionalLight.position.set(rsun[1], rsun[2], rsun[0]);
      scene.add(directionalLight);
      scene.add(new THREE.DirectionalLightHelper(directionalLight, 8000 * scale, 0x888888));
      const line = new THREE.Line(
          new THREE.BufferGeometry().setFromPoints([
              new THREE.Vector3(0, 0, 0),
              new THREE.Vector3(rsun[1] * 8000 * scale, rsun[2] * 8000 * scale, rsun[0] * 8000 * scale)
          ]),
          new THREE.LineBasicMaterial({color: 0x888888})
      );
      scene.add(line)
      // 環境光源
      const ambientLight = new THREE.AmbientLight(0xffffff, 2);
      scene.add(ambientLight);
    }

    const automaticallyGenerated = document.getElementById('automatically_generated');
    // GLTFLoader: https://threejs.org/docs/#examples/en/loaders/GLTFLoader
    const loader = new GLTFLoader();
    loader.loadAsync(
      // Earth_1_12756.glb: Earth 3D Model:
      //  https://science.nasa.gov/resource/earth-3d-model/ の読み込み
      'Earth_1_12756.glb',
      // EarthClouds_1_12756.glb: Earth with Clouds 3D Model:
      //  https://science.nasa.gov/resource/earth-with-clouds-3d-model/
      // 'EarthClouds_1_12756.glb',
      xhr => {
        automaticallyGenerated.innerText = Math.round((xhr.loaded / xhr.total) * 100) + '% loaded';
      })
      .then(gltf => {
        const earth = gltf.scene;
        scene.add(earth);
        const boundingBox = new THREE.Box3().setFromObject(earth);
        const boxSize = boundingBox.getSize(new THREE.Vector3());
        automaticallyGenerated.innerText = `Size of Earth 3D Model: x=${boxSize.x}, y=${boxSize.y}, z=${boxSize.z}`;
        earth.rotation.y = Math.PI + gmst;

        initLight();
      })
      .catch(error => {
        automaticallyGenerated.innerText = error;
      });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    function onWindowResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(width, height);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }
    onWindowResize();
    window.addEventListener('resize', onWindowResize);
  </script>
</body>

</html>
