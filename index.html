<!DOCTYPE html>
<html lang="en">

<head>
  <title>Earth 3D Model - Earth_1_12756.glb</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #info {
      color: #888888;
      position: absolute;
      top: 10px;
      width: 100%;
      z-index: 100;
      display: block;
    }
  </style>
</head>

<body>
  <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.177.0/build/three.module.js",
          "three/addons/controls/OrbitControls": "https://unpkg.com/three@0.177.0/examples/jsm/controls/OrbitControls.js",
          "three/addons/loaders/GLTFLoader": "https://unpkg.com/three@0.177.0/examples/jsm/loaders/GLTFLoader.js"
        }
      }
    </script>
  <div id="info">
    Earth 3D Model - https://science.nasa.gov/resource/earth-3d-model/
    <div id="automatically_generated">
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/6.0.1/satellite.min.js"></script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader';

    THREE.Object3D.DEFAULT_UP.set(0, 0, 1);

    const renderer = new THREE.WebGLRenderer();
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1;
    document.body.appendChild(renderer.domElement);
    const scene = new THREE.Scene();

    // XYZ軸を表示
    const axesHelper = new THREE.AxesHelper(10000);
    scene.add(axesHelper);

    const now = new Date();
    // const now = new Date('2025-3-21 12:00:00+0:00');
    const jday = satellite.jday(now);
    const gmst = satellite.gstime(now);

    // カメラ
    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      1,
      100000
    );

    function geodeticToEci(longitude, latitude, height) {
      const ecf = satellite.geodeticToEcf({
        longitude: satellite.degreesToRadians(longitude),
        latitude: satellite.degreesToRadians(latitude),
        height: height
      });
      const eci = satellite.ecfToEci(ecf, gmst);
      // return new THREE.Vector3(eci.y, eci.z, eci.x);
      return new THREE.Vector3(eci.x, eci.y, eci.z);
    }

    (() => {
      const eci = geodeticToEci(150.0, 0.0, 10000);
      camera.position.copy(eci);
    })();
    const controls = new OrbitControls(camera, renderer.domElement);

    function initLight() {
      // 平行光源
      const directionalLight = new THREE.DirectionalLight(0xffffff, 10);
      const rsun = satellite.sunPos(jday).rsun;
      // directionalLight.position.set(rsun[1], rsun[2], rsun[0]);
      directionalLight.position.set(rsun[0], rsun[1], rsun[2]);
      scene.add(directionalLight);
      const lineLen = 10000;
      scene.add(new THREE.DirectionalLightHelper(directionalLight, lineLen, 0x888888));
      const line = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(0, 0, 0),
          // new THREE.Vector3(rsun[1] * lineLen, rsun[2] * lineLen, rsun[0] * lineLen)
          new THREE.Vector3(rsun[0] * lineLen, rsun[1] * lineLen, rsun[2] * lineLen)
        ]),
        new THREE.LineBasicMaterial({ color: 0x888888 })
      );
      scene.add(line)
      // 環境光源
      const ambientLight = new THREE.AmbientLight(0xffffff, 2);
      scene.add(ambientLight);
    }

    function textSprite(text) {
      const canvas = document.createElement('canvas');
      const fontSize = 200;
      canvas.height = fontSize;
      const context = canvas.getContext('2d');
      const font = `${fontSize}px Arial`;
      context.font = font;
      const metrics = context.measureText(text);
      canvas.width = metrics.width;
      //context.fillStyle = '#ffffff'; // Background color
      //context.fillRect(0, 0, canvas.width, canvas.height);
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      context.fillStyle = '#888888';
      context.font = font; // need to set again
      context.fillText(text, canvas.width / 2, canvas.height / 2);
      const texture = new THREE.CanvasTexture(canvas);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture }));
      sprite.scale.set(canvas.width, canvas.height, 1);
      sprite.center = new THREE.Vector2(0.5, 0.5);
      return sprite;
    }

    function mark(text, longitude, latitude) {
      const eci0 = geodeticToEci(longitude, latitude, 300);
      const sprite = textSprite(text);
      sprite.position.copy(eci0);
      scene.add(sprite);
      const eci1 = geodeticToEci(longitude, latitude, 0);
      const line = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([eci0, eci1]),
        new THREE.LineBasicMaterial({ color: 0x888888 })
      );
      scene.add(line)
    }

    const automaticallyGenerated = document.getElementById('automatically_generated');
    // GLTFLoader: https://threejs.org/docs/#examples/en/loaders/GLTFLoader
    const loader = new GLTFLoader();
    loader.loadAsync(
      // Earth_1_12756.glb: Earth 3D Model:
      //  https://science.nasa.gov/resource/earth-3d-model/ の読み込み
      'Earth_1_12756.glb',
      // EarthClouds_1_12756.glb: Earth with Clouds 3D Model:
      //  https://science.nasa.gov/resource/earth-with-clouds-3d-model/
      // 'EarthClouds_1_12756.glb',
      xhr => {
        automaticallyGenerated.innerText = Math.round((xhr.loaded / xhr.total) * 100) + '% loaded';
      })
      .then(gltf => {
        const earthSemiMajorAxis = 6378.1370;
        const earthSemiMinorAxes = 6356.7523;
        const earth = gltf.scene;
        scene.add(earth);
        const boundingBox = new THREE.Box3().setFromObject(earth);
        const boxSize = boundingBox.getSize(new THREE.Vector3());
        automaticallyGenerated.innerText = `Size of Earth 3D Model: x=${boxSize.x}, y=${boxSize.y}, z=${boxSize.z}`;
        earth.scale.x = earthSemiMajorAxis * 2 / boxSize.x;
        earth.scale.y = earthSemiMinorAxes * 2 / boxSize.y;
        earth.scale.z = earthSemiMajorAxis * 2 / boxSize.z;
        const boundingBox2 = new THREE.Box3().setFromObject(earth);
        const boxSize2 = boundingBox2.getSize(new THREE.Vector3());
        automaticallyGenerated.innerText += ` -> x=${boxSize2.x}, y=${boxSize2.y}, z=${boxSize2.z}`;
        // earth.rotation.y = Math.PI + gmst;
        earth.rotation.x = Math.PI / 2;
        earth.rotation.y = -Math.PI / 2 + gmst;

        initLight();

        mark('Tokyo', 139.7535, 35.694);
      })
      .catch(error => {
        automaticallyGenerated.innerText = error;
      });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    function onWindowResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(width, height);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }
    onWindowResize();
    window.addEventListener('resize', onWindowResize);
  </script>
</body>

</html>
